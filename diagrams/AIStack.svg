<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 0 1260 860" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Markers for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-sub" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e" />
    </marker>
    
    <!-- Gradients -->
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6beb" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="bold">AI Gateway &amp; Proxy Infrastructure Architecture</text>

  <!-- 1. Desktop Clients / IDEs -->
  <g transform="translate(250, 60)">
    <rect x="0" y="0" width="500" height="70" rx="8" fill="url(#box-grad)" stroke="#30363d" stroke-width="2" />
    <text x="250" y="28" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="bold">[ Desktop Clients / IDEs ]</text>
    <text x="250" y="52" text-anchor="middle" fill="#8b949e" font-size="13">OpenCode, VSCode, Claude Code, Continue.dev</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 500 130 L 500 160" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <!-- 2. Network & Edge Security -->
  <g transform="translate(180, 160)">
    <rect x="0" y="0" width="340" height="65" rx="8" fill="url(#box-grad)" stroke="#30363d" stroke-width="2" />
    <text x="170" y="38" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="bold">[ Network &amp; Edge Security ]</text>
  </g>

  <!-- Edge Security Side Box -->
  <g transform="translate(550, 160)">
    <rect x="0" y="0" width="270" height="65" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="135" y="28" text-anchor="middle" fill="#c9d1d9" font-size="12">Route 53 + ALB + AWS WAF</text>
    <text x="135" y="48" text-anchor="middle" fill="#c9d1d9" font-size="12">+ AWS IAM Identity Center/OIDC</text>
  </g>

  <!-- Connection: Edge Security to Side Details -->
  <path d="M 520 192.5 L 550 192.5" stroke="#8b949e" stroke-width="1.5" fill="none" />

  <!-- Arrow 2 -> 3 -->
  <path d="M 350 225 L 350 260" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <!-- 3. AI Gateway / Proxy Tier Container -->
  <g transform="translate(150, 260)">
    <rect x="0" y="0" width="400" height="75" rx="8" fill="url(#box-grad)" stroke="#238636" stroke-width="2" />
    <text x="200" y="30" text-anchor="middle" fill="#3fb950" font-size="16" font-weight="bold">[ AI Gateway / Proxy Tier ]</text>
    <text x="200" y="52" text-anchor="middle" fill="#8b949e" font-size="13">LiteLLM Proxy running on ECS Fargate or EKS</text>
  </g>

  <!-- Left Side Annotations for AI Gateway -->
  <g transform="translate(40, 265)">
    <path d="M 100 10 L 80 10 L 80 70 L 100 70 M 80 40 L 95 40" stroke="#30363d" stroke-width="2" fill="none" />
    
    <text x="70" y="14" text-anchor="end" fill="#8b949e" font-size="12">
      <tspan x="70" dy="0">• Authenticates users via</tspan>
      <tspan x="70" dy="14">SSO/Virtual Keys</tspan>
    </text>
    <text x="70" y="48" text-anchor="end" fill="#8b949e" font-size="12">
      <tspan x="70" dy="0">• Enforces rate limits,</tspan>
      <tspan x="70" dy="14">budget caps, PII masking</tspan>
      <tspan x="70" dy="14">&amp; logging</tspan>
    </text>
    <text x="70" y="96" text-anchor="end" fill="#8b949e" font-size="12">
      <tspan x="70" dy="0">• Translates to uniform</tspan>
      <tspan x="70" dy="14">OpenAI API</tspan>
      <tspan x="70" dy="14">(/v1/chat/completions)</tspan>
    </text>
  </g>

  <!-- Branching Arrows from AI Gateway -->
  <!-- Split Point -->
  <path d="M 350 335 L 350 380" stroke="#58a6ff" stroke-width="2" fill="none" />
  <path d="M 210 380 L 580 380" stroke="#58a6ff" stroke-width="2" fill="none" />

  <!-- Arrow to Cache & State -->
  <path d="M 210 380 L 210 420" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  
  <!-- Arrow to Inference Engine Routing -->
  <path d="M 580 380 L 580 420" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <!-- 4. Cache &amp; State Tier -->
  <g transform="translate(170, 420)">
    <rect x="0" y="0" width="320" height="90" rx="8" fill="url(#box-grad)" stroke="#30363d" stroke-width="2" />
    <text x="160" y="32" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="bold">[ Cache &amp; State ]</text>
    <text x="160" y="56" text-anchor="middle" fill="#8b949e" font-size="13">Amazon ElastiCache Redis</text>
    <text x="160" y="74" text-anchor="middle" fill="#8b949e" font-size="13">+ Amazon RDS PostgreSQL</text>
  </g>

  <!-- 5. Inference Engine Routing (Group Container) -->
  <g transform="translate(560, 420)">
    <rect x="0" y="0" width="540" height="390" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2" />
    <text x="270" y="35" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="bold">[ Inference Engine Routing ]</text>

    <!-- Sub-target 1: Self-Hosted GPUs -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="480" height="90" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
      <text x="20" y="32" fill="#bc8cff" font-size="14" font-weight="bold">► Self-Hosted GPUs</text>
      <text x="35" y="55" fill="#c9d1d9" font-size="13">Infrastructure: EKS + vLLM / SGLang</text>
      <text x="35" y="73" fill="#8b949e" font-size="12">Models: Qwen-Code, DeepSeek, Llama</text>
    </g>

    <!-- Sub-target 2: Managed AWS -->
    <g transform="translate(30, 170)">
      <rect x="0" y="0" width="480" height="90" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
      <text x="20" y="32" fill="#ff7b72" font-size="14" font-weight="bold">► Managed AWS</text>
      <text x="35" y="55" fill="#c9d1d9" font-size="13">Provider: Amazon Bedrock (via VPC Endpoints)</text>
      <text x="35" y="73" fill="#8b949e" font-size="12">Models: Claude 3.5 / 3.7, Llama</text>
    </g>

    <!-- Sub-target 3: External SaaS -->
    <g transform="translate(30, 280)">
      <rect x="0" y="0" width="480" height="90" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
      <text x="20" y="32" fill="#d2a8ff" font-size="14" font-weight="bold">► External SaaS</text>
      <text x="35" y="55" fill="#c9d1d9" font-size="13">Providers: Azure OpenAI / Anthropic</text>
      <text x="35" y="73" fill="#8b949e" font-size="12">Egress Route: via Egress Proxy / NAT Gateway</text>
    </g>
  </g>
</svg>